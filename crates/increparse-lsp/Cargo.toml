[package]
name = "increparse-lsp"
version = "0.4.0"
edition = "2021"
description = "LSP adapter for increparse: documents, position encodings, and diagnostics bridges."
license = "MIT OR Apache-2.0"
repository = "https://github.com/thyrgle/increparse"
readme = "../../README.md"
keywords = ["lsp", "language-server", "incremental", "parser"]
categories = ["parsing", "development-tools"]

[dependencies]
increparse = { path = "../increparse", version = "0.1.0" }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = "1"

[dev-dependencies]
serde = "1"
serde_json = "1"
