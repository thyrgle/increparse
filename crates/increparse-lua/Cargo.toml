[package]
name = "increparse-lua"
version = "0.1.1"
edition = "2021"
description = "Define an increparse language server in pure Lua: passes, diagnostics, and symbols in one Lua file."
license = "MIT OR Apache-2.0"
repository = "https://github.com/thyrgle/increparse"
readme = "../../README.md"
keywords = ["parser", "lua", "lsp", "neovim"]
categories = ["parsing"]

[dependencies]
increparse = { path = "../increparse", version = "0.1.0" }
increparse-lsp = { path = "../increparse-lsp" }
lsp-types = "0.97"
mlua = { version = "0.12", features = ["lua54", "send", "vendored"] }

[dev-dependencies]
serde_json = "1"

[lib]
name = "increparse_lua"

[[bin]]
name = "increparse-lua-server"
path = "src/bin/server.rs"
