name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Documentation
      run: cargo doc --no-deps
    - name: Package dry-run
      run: |
        cargo package --list -p increparse
        cargo package --list -p increparse-lsp
        cargo package --list -p increparse-nom
        cargo package --list -p increparse-chumsky
        cargo package --list -p increparse-lua

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--all-features"]
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        # Distinct key per matrix leg, or "" and "--all-features" evict
        # each other's cache.
        key: ${{ matrix.features }}
    - name: Build
      run: cargo build --verbose ${{ matrix.features }}
    - name: Run tests
      run: cargo test --workspace --verbose ${{ matrix.features }}
    - name: Bench smoke
      run: cargo bench --bench parse -- --quick
